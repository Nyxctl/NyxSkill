{
  "id": "nyx.reverse-engineering.dotnet-reverse",
  "name": "Dotnet Reverse",
  "version": "1.0.0",
  "api_version": 1,
  "category": "reverse-engineering.dotnet-reverse",
  "type": "domain",
  "profiles": [
    "reverse-engineering"
  ],
  "description": "Inspect .NET metadata and C# assemblies, including Unity managed and RimWorld mod libraries, without loading target code.",
  "routing": {
    "priority": 80,
    "triggers": {
      "keywords": [
        ".net assembly",
        "managed assembly",
        "unity managed",
        "rimworld dll",
        "dotnet reverse"
      ],
      "intents": [
        "dotnet-reverse"
      ]
    }
  },
  "composition": {
    "requires": [
      "nyx.reverse-engineering.reverse-triage"
    ],
    "before": [],
    "after": []
  },
  "conflicts_with": [],
  "capabilities": {
    "required": [
      "filesystem.read"
    ],
    "optional": [
      "filesystem.write",
      "shell"
    ]
  },
  "risk": {
    "level": "read-only",
    "destructive": false,
    "requires_confirmation": false
  },
  "runtime": {
    "supported": [
      "inwjud",
      "codex",
      "claude-code",
      "cursor",
      "agents"
    ]
  },
  "provenance": {
    "origin": "nyx-native",
    "source": null,
    "adapted_from": null,
    "license": "MIT"
  },
  "compatibility": {
    "nyxskill": ">=1.0.0 <2.0.0",
    "api": "^1"
  }
}
