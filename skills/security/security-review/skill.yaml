{
  "id": "nyx.security.security-review",
  "name": "Security Review",
  "version": "1.0.0",
  "api_version": 1,
  "category": "security.security-review",
  "type": "policy",
  "profiles": [
    "security",
    "coding",
    "browser-extension"
  ],
  "description": "Review attack surface, trust boundaries, data exposure, validation, secrets, authorization, dependencies, and abuse cases.",
  "routing": {
    "priority": 90,
    "triggers": {
      "keywords": [
        "security",
        "vulnerability",
        "threat model"
      ],
      "intents": [
        "security-review"
      ]
    }
  },
  "composition": {
    "requires": [],
    "before": [],
    "after": []
  },
  "conflicts_with": [],
  "capabilities": {
    "required": [
      "filesystem.read"
    ],
    "optional": [
      "network.http"
    ]
  },
  "risk": {
    "level": "read-only",
    "destructive": false,
    "requires_confirmation": false
  },
  "runtime": {
    "supported": [
      "inwjud",
      "codex",
      "claude-code",
      "cursor",
      "agents"
    ]
  },
  "provenance": {
    "origin": "nyx-native",
    "source": null,
    "adapted_from": null,
    "license": "MIT"
  },
  "compatibility": {
    "nyxskill": ">=1.0.0 <2.0.0",
    "api": "^1"
  }
}
