      "filesystem.read"
    ],
    "optional": [
      "network.http"
    ]
  },
  "risk": {
    "level": "read-only",
    "destructive": false,
    "requires_confirmation": false
  },
  "runtime": {
    "supported": [
      "inwjud",
      "codex",
      "claude-code",
      "cursor",
      "agents"
    ]
  },
  "provenance": {
    "origin": "adapted",
    "source": "journalism",
    "adapted_from": "secure-auth",
    "license": "MIT"
  },
