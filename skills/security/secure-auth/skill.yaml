{
  "id": "nyx.security.secure-auth",
  "name": "Secure Auth",
  "version": "1.0.0",
  "api_version": 1,
  "category": "security.secure-auth",
  "type": "policy",
  "profiles": [
    "security",
    "coding",
    "browser-extension"
  ],
