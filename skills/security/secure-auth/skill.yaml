        "auth",
        "oauth",
        "login",
        "session",
        "token"
      ],
      "intents": [
        "secure-auth"
      ]
    }
  },
  "composition": {
    "requires": [],
    "before": [],
    "after": []
  },
  "conflicts_with": [],
