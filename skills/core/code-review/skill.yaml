{
  "id": "nyx.core.code-review",
  "name": "Code Review",
  "version": "1.0.0",
  "api_version": 1,
  "category": "core.code-review",
  "type": "policy",
  "profiles": [
    "coding",
    "product"
  ],
  "description": "Review changes for correctness, regressions, maintainability, tests, security impact, and evidence.",
  "routing": {
    "priority": 82,
    "triggers": {
      "keywords": [
        "code review",
        "review code",
        "quality"
      ],
      "intents": [
        "review"
      ]
    }
  },
  "composition": {
    "requires": [],
    "before": [],
    "after": []
  },
  "conflicts_with": [],
  "capabilities": {
    "required": [
      "filesystem.read"
    ],
    "optional": []
  },
  "risk": {
    "level": "read-only",
    "destructive": false,
    "requires_confirmation": false
  },
  "runtime": {
    "supported": [
      "inwjud",
      "codex",
      "claude-code",
      "cursor",
      "agents"
    ]
  },
  "provenance": {
    "origin": "adapted",
    "source": "superpowers",
    "adapted_from": "requesting-code-review",
    "license": "MIT"
  },
  "compatibility": {
    "nyxskill": ">=1.0.0 <2.0.0",
    "api": "^1"
  }
}
