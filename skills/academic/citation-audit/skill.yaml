    "priority": 73,
    "triggers": {
      "keywords": [
        "citation",
        "references",
        "bibliography"
      ],
      "intents": [
        "review"
      ]
    }
  },
  "composition": {
    "requires": [],
    "before": [],
    "after": []
  },
  "conflicts_with": [],
