    "required": [
      "filesystem.read"
    ],
    "optional": []
  },
  "risk": {
    "level": "read-only",
    "destructive": false,
    "requires_confirmation": false
  },
  "runtime": {
    "supported": [
      "inwjud",
      "codex",
      "claude-code",
      "cursor",
      "agents"
    ]
  },
  "provenance": {
    "origin": "nyx-native",
